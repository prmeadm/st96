<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>ST96 — видео</title>
  <!-- Плеер YouTube внутри Telegram: бот открывает эту страницу кнопкой «Смотреть видео» (Telegram Mini App), ролик играет, не выходя из чата -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #09090b; color: #f5f4ef; font: 15px/1.4 system-ui, sans-serif; }
    .wrap { position: fixed; inset: 0; display: grid; place-items: center; }
    iframe { width: 100%; height: 100%; border: 0; }
    p { padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap" id="wrap"></div>
  <script>
    (function () {
      var id = new URLSearchParams(location.search).get('v') || ''
      var wrap = document.getElementById('wrap')
      if (!/^[\w-]{11}$/.test(id)) { wrap.innerHTML = '<p>Видео не найдено</p>'; return }
      var t = parseInt(new URLSearchParams(location.search).get('t') || '0', 10) || 0
      var f = document.createElement('iframe')
      f.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&playsinline=1&rel=0&modestbranding=1' + (t ? '&start=' + t : '')
      f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen'
      f.allowFullscreen = true
      wrap.appendChild(f)
      var tg = window.Telegram && window.Telegram.WebApp
      if (tg) { tg.ready(); tg.expand() }
    })()
  </script>
</body>
</html>
