            {t && <>
              <div style={{ display:'flex', alignItems:'flex-start', gap:10 }}>
                <button className="btn icon back" onClick={() => setOpen(null)} aria-label="К списку">‹</button>
                <div style={{ flex:1, minWidth:0 }}>
                  <h2 style={{ margin:'0 0 6px', fontSize:18, lineHeight:1.25 }}>{t.title}</h2>
                  <span className="chip" style={{ background:ASTATUS[t.status][2], color:ASTATUS[t.status][1] }}>{t.status === 'planning' && <i className="spin" />}{ASTATUS[t.status][0]}</span>
                  <span className="hint"> · версия плана {t.rev}</span>
                </div>
              </div>

              <div className="card">
                <div className="h2" style={{ marginBottom:8 }}>Задание</div>
                <Rich text={t.text} />
                {t.attach.length > 0 && <div className="thumbs" style={{ marginTop:10 }}>{t.attach.map(f => <div className="thumb" key={f.id}><span className="ti"><Ic d={KIND_IC[f.kind]} size={22} /></span><span className="tn">{f.name}</span></div>)}</div>}
              </div>

              {t.status === 'planning' && <div className="card" style={{ display:'flex', gap:10, alignItems:'center' }}><i className="spin" /><span>Агент составляет план. Ничего не выполняется.</span></div>}

              {t.plan.length > 0 && <div className="card">
                <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:6 }}><h3 style={{ margin:0 }}>План действий</h3><span className="sp" style={{ flex:1 }} />
                  {(t.status === 'running' || t.status === 'paused' || t.status === 'done') && <span className="hint">{doneN} из {onN}</span>}</div>
                {t.status === 'approval' && <div className="hint" style={{ marginBottom:6 }}>Проверьте шаги: отредактируйте текст, выключите лишнее или напишите замечание. Пока вы не нажмёте «Утвердить», ничего не выполняется.</div>}
                {(t.status === 'running' || t.status === 'paused') && <div className="pbar" style={{ margin:'4px 0 6px' }}><i style={{ width:`${onN ? Math.round(doneN / onN * 100) : 0}%` }} /></div>}
                {t.plan.map((s, i) => { const r = RISK[s.risk], edit = t.status === 'approval', st = !s.on && s.state === 'todo' ? 'off' : s.state; return (
                  <div key={s.id} className={`step ${st}`}>
                    <span className="n">{s.state === 'done' ? '✓' : s.state === 'skipped' ? '–' : i + 1}</span>
                    <div style={{ flex:1, minWidth:0, display:'flex', flexDirection:'column', gap:4 }}>
                      {edit ? <textarea className="stx" rows={1} value={s.text} onChange={e => upStep(s.id, { text:e.target.value })} aria-label={`Шаг ${i + 1}`} ref={el => { if (el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; } }} /> : <div style={{ padding:'4px 0' }}>{s.text}</div>}
                      <div style={{ display:'flex', gap:6, alignItems:'center', flexWrap:'wrap' }}>
                        <span className="chip" style={{ background:r[2], color:r[1] }}>{r[0]}</span>{s.state === 'run' && <><i className="spin" /><span className="hint">выполняется</span></>}
                        {edit && <button className="lnk" onClick={() => delStep(s.id)}>убрать шаг</button>}
                      </div>
                    </div>
                    {edit && <Sw on={s.on} onChange={v => upStep(s.id, { on:v })} />}
                  </div>); })}
                {t.status === 'approval' && <button className="lnk" style={{ marginTop:8 }} onClick={addStep}>+ добавить шаг</button>}
              </div>}

              {pending && <div className="card" style={{ borderColor:'var(--red)', background:'var(--red-soft)' }}>
                <b>Нужно ваше подтверждение</b>
                <div style={{ margin:'6px 0 10px' }}>Агент дошёл до шага «{pending.text}». Это действие нельзя отменить после запуска, поэтому он ждёт вас.</div>
                <div className="actbar"><button className="btn" onClick={() => danger(false)}>Пропустить шаг</button><button className="btn primary" onClick={() => danger(true)}>Подтвердить и выполнить</button></div>
              </div>}

              {t.status === 'approval' && <div className="card"><div className="fld"><label>Что поправить в плане (необязательно)</label><textarea value={note} onChange={e => setNote(e.target.value)} placeholder="Например: сначала покажи текст мне, без отправки" style={{ minHeight:64 }} /></div></div>}

              {t.status === 'done' && t.report && <div className="card" style={{ borderColor:'var(--green)' }}>
                <h3 style={{ color:'var(--green)' }}>Отчёт агента</h3>
                <div style={{ marginBottom:8 }}>{t.report.summary}</div>
                {t.report.results.map((x, i) => <div key={i} className="hint" style={{ padding:'3px 0' }}>✓ {x}</div>)}
                <div className="hint" style={{ marginTop:8 }}>Токенов: {t.report.tokens.toLocaleString('ru-RU')} · ориентировочно ${t.report.cost} (демо-цифры)</div>
                <div className="actbar" style={{ marginTop:12, justifyContent:'flex-start' }}>
                  <button className="btn" onClick={dl}>Скачать отчёт</button>
                  <button className="btn" onClick={() => flash('Сохранено в библиотеку шаблонов (демо)')}>В шаблоны</button>
                  <button className="btn" onClick={repeat}>Повторить</button>
                </div>
              </div>}

              <details className="card" open={t.status !== 'approval'}><summary style={{ cursor:'pointer', fontWeight:600 }}>Журнал действий ({t.log.length})</summary>
                <div style={{ display:'flex', flexDirection:'column', gap:6, marginTop:10 }}>{[...t.log].reverse().map((l, i) => <div className="logl" key={i}><time>{ftm(l.at)}</time><span>{l.text}</span></div>)}</div></details>

              {t.status === 'approval' && <div className="actbar sticky">
                <button className="btn" onClick={reject}>Отклонить</button>
                <button className="btn" onClick={revise}>Доработать план</button>
                <button className="btn primary" onClick={approve}>Утвердить и запустить</button>
              </div>}
              {(t.status === 'running' || t.status === 'paused') && <div className="actbar sticky"><button className="btn" onClick={stop}>Остановить</button></div>}
            </>}
          </div>
        </div>
        {toast && <div className="toast">{toast}</div>}
      </div>
      {compose && <Composer onCreate={create} onClose={() => setCompose(false)} />}
    </div>
  );
}

/* ───────── библиотека шаблонов ───────── */
const TKEY = 'st96-tpl-v1';
const TTYPES = { text:['Текст', P.msg], photo:['Фото', P.img], video:['Видео', P.vid], audio:['Аудио', P.aud] };
const TTASKS = ['Первое касание', 'Ответ на вопрос', 'Напоминание', 'Дожим', 'Рассылка', 'После встречи'];
const TGOALS = ['Привлечь заявку', 'Записать на встречу', 'Прогреть', 'Вернуть клиента', 'Собрать отзыв', 'Информировать'];
const TSERV = [...SERVICES, 'Общее'];
const TVARS = [['{имя}', 'Анна'], ['{услуга}', 'Ретушь'], ['{дата}', '22 октября'], ['{время}', '11:00'], ['{формат}', 'видеозвонок']];
const GRAD = ['linear-gradient(135deg,#7c4dff,#2f5bff)', 'linear-gradient(135deg,#0f9aa8,#19a463)', 'linear-gradient(135deg,#e8890c,#e5484d)', 'linear-gradient(135deg,#2f5bff,#0f9aa8)', 'linear-gradient(135deg,#e5484d,#7c4dff)'];
const grad = id => GRAD[[...id].reduce((a, c) => a + c.charCodeAt(0), 0) % GRAD.length];
const fillVars = txt => TVARS.reduce((t, [k, v]) => t.split(k).join(v), txt);

function seedTpl() {
  const T = (id, type, title, body, task, goal, services, media = '', used = 0, fav = false) => ({ id, type, title, body, task, goal, services, media, used, fav });
  return [
    T('a1', 'text', 'Приветствие в боте', 'Здравствуйте, {имя}! Это студия ST96. Помогу подобрать услугу и записать на встречу. Что вас интересует?', 'Первое касание', 'Привлечь заявку', ['Общее'], '', 41, true),
    T('a2', 'text', 'Ответ: сколько стоит ретушь', 'Стоимость ретуши зависит от объёма: от {от} за кадр. Пришлите 1–2 фото, и я назову точную цену и сроки.'.replace('{от}', '10 BYN'), 'Ответ на вопрос', 'Прогреть', ['Ретушь'], '', 27),
    T('a3', 'text', 'Напоминание за час', '{имя}, напоминаем: сегодня в {время} встреча со студией ST96 ({формат}). Не опаздывайте!', 'Напоминание', 'Информировать', ['Общее'], '', 63, true),
    T('a4', 'text', 'Возврат спящего клиента', '{имя}, давно не виделись! Для вас до конца месяца скидка 15% на {услуга}. Напомнить, как записаться?', 'Дожим', 'Вернуть клиента', ['Ретушь', 'Цветокоррекция'], '', 9),
    T('a5', 'photo', 'До/после: ретушь портрета', 'Вот что получается после ретуши — естественно, без «пластика». Хотите так же? Нажмите «Записаться».', 'Рассылка', 'Прогреть', ['Ретушь'], 'before-after.jpg', 18),
    T('a6', 'video', 'Как проходит нейрофотосессия', 'За 40 секунд — весь процесс: от загрузки фото до готовых кадров. Лицо переносится без искажений.', 'Рассылка', 'Прогреть', ['Нейрофотосессия'], 'process.mp4', 12),
    T('a7', 'audio', 'Голосовое: приглашение на съёмку', 'Короткое голосовое от администратора: приглашение на пробную съёмку и как выбрать время.', 'Первое касание', 'Записать на встречу', ['Съёмка'], 'invite.ogg', 5),
    T('a8', 'text', 'Запрос отзыва', '{имя}, спасибо, что выбрали ST96! Оставьте, пожалуйста, пару слов о работе — это очень помогает. Ссылка: st96.by/review', 'После встречи', 'Собрать отзыв', ['Общее'], '', 22),
    T('a9', 'text', 'Подтверждение записи', '{имя}, администратор принял время и дату: {дата}, {время}. Просим не опаздывать. Файл для календаря — во вложении.', 'Напоминание', 'Записать на встречу', ['Общее'], '', 88, true),
    T('b1', 'photo', 'Портфолио: цветокоррекция', 'Один и тот же кадр до и после цветокоррекции. Разбираем, что именно изменили.', 'Рассылка', 'Привлечь заявку', ['Цветокоррекция'], 'color-grade.jpg', 7),
    T('b2', 'text', 'Ответ на возражение «дорого»', 'Понимаю. Давайте начнём с малого: пробная {услуга} на одном кадре, чтобы вы увидели качество до оплаты всего объёма.', 'Дожим', 'Прогреть', ['Нейрофотосессия'], '', 14),
    T('b3', 'video', 'Приветствие от основателя', 'Видео-кружок 30 секунд: кто мы и чем можем помочь вашему бренду.', 'Первое касание', 'Привлечь заявку', ['Общее'], 'hello.mp4', 3),
  ];
}
function loadT() { try { const s = JSON.parse(localStorage.getItem(TKEY)); if (Array.isArray(s)) return s; } catch (e) {} return seedTpl(); }

function FilterGroups({ f, setF, tpls }) {
  const cnt = (k, v) => tpls.filter(t => k === 'service' ? t.services.includes(v) : t[k] === v).length;
  const tog = (k, v) => setF({ ...f, [k]:f[k].includes(v) ? f[k].filter(x => x !== v) : [...f[k], v] });
  const G = (k, title, opts) => (
    <div key={k}>
      <div className="h2" style={{ marginBottom:8 }}>{title}</div>
      <div className="chips">{opts.map(o => <button key={o} className={f[k].includes(o) ? 'on' : ''} onClick={() => tog(k, o)}>{o} <small style={{ opacity:.6 }}>{cnt(k, o)}</small></button>)}</div>
    </div>);
  return <>{G('task', 'Задача', TTASKS)}{G('goal', 'Цель', TGOALS)}{G('service', 'Услуга', TSERV)}</>;
}

function TplEditor({ t, isNew, onSave, onClose, onDelete, onDup, flash }) {
  const [d, setD] = useState(t), ta = useRef(null);
  const up = p => setD({ ...d, ...p });
  const ins = v => { const el = ta.current, s = el ? el.selectionStart : d.body.length; up({ body:d.body.slice(0, s) + v + d.body.slice(el ? el.selectionEnd : s) }); setTimeout(() => el && el.focus(), 0); };
  const toggleS = s => up({ services:d.services.includes(s) ? d.services.filter(x => x !== s) : [...d.services, s] });
  const ok = d.title.trim() && (d.type !== 'text' ? d.media || d.body.trim() : d.body.trim()) && d.services.length;
  const missing = [!d.title.trim() && 'название', !d.body.trim() && d.type === 'text' && 'текст', d.type !== 'text' && !d.media && 'файл', !d.services.length && 'услугу'].filter(Boolean);
  const use = where => { flash(`«${d.title}» вставлен: ${where} (демо)`); onSave({ ...d, used:d.used + 1 }, true); };
  return (
    <div className="ov" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="mh"><b style={{ fontSize:16 }}>{isNew ? 'Новый шаблон' : 'Шаблон'}</b><span className="sp" />
          <button className="x" onClick={() => up({ fav:!d.fav })} aria-label="В избранное" style={{ fontSize:20, color:d.fav ? 'var(--amber)' : 'var(--mute)' }}>{d.fav ? '★' : '☆'}</button>
          <button className="x" onClick={onClose} aria-label="Закрыть">✕</button></div>
        <div className="mb">
          <div className="seg">{Object.entries(TTYPES).map(([k, [l]]) => <button key={k} className={d.type === k ? 'on' : ''} onClick={() => up({ type:k })}>{l}</button>)}</div>
          <div className="fld"><label>Название</label><input type="text" value={d.title} onChange={e => up({ title:e.target.value })} placeholder="Например, «Напоминание за час»" /></div>
          {d.type !== 'text' && <div className="fld"><label>{TTYPES[d.type][0]}</label>
            <div className="tmedia" style={{ background:grad(d.id), marginBottom:8 }}><Ic d={TTYPES[d.type][1]} size={30} /><span className="tn2">{d.media || 'файл не выбран'}</span></div>
            <label className="btn">Загрузить файл<input type="file" hidden accept={d.type === 'photo' ? 'image/*' : d.type === 'video' ? 'video/*' : 'audio/*'} onChange={e => e.target.files[0] && up({ media:e.target.files[0].name })} /></label></div>}
          <div className="fld"><label>{d.type === 'text' ? 'Текст сообщения' : 'Подпись'}</label>
            <div className="chips" style={{ marginBottom:6 }}>{TVARS.map(([k]) => <button key={k} onClick={() => ins(k)}>{k}</button>)}</div>
            <textarea ref={ta} value={d.body} onChange={e => up({ body:e.target.value })} style={{ minHeight:110 }} /></div>
          <div className="fld"><label>Предпросмотр в Telegram</label>
            <div className="tgprev">{d.type !== 'text' && <div className="tmedia sm" style={{ background:grad(d.id) }}><Ic d={TTYPES[d.type][1]} size={26} /></div>}<div style={{ whiteSpace:'pre-wrap' }}>{fillVars(d.body) || '…'}</div></div></div>
          <div className="fld"><label>Задача</label><select value={d.task} onChange={e => up({ task:e.target.value })}>{TTASKS.map(x => <option key={x}>{x}</option>)}</select></div>
          <div className="fld"><label>Цель</label><select value={d.goal} onChange={e => up({ goal:e.target.value })}>{TGOALS.map(x => <option key={x}>{x}</option>)}</select></div>
          <div className="fld"><label>Услуги</label><div className="chips">{TSERV.map(s => <button key={s} className={d.services.includes(s) ? 'on' : ''} onClick={() => toggleS(s)}>{s}</button>)}</div></div>
          {!isNew && <div className="fld"><label>Использовать</label><div className="chips">
            <button onClick={() => use('в сообщение воронки')}>В воронку</button><button onClick={() => use('в задание агента')}>В задание агента</button><button onClick={() => use('в рассылку')}>В рассылку</button>
            <button onClick={() => { try { navigator.clipboard.writeText(d.body); } catch (e) {} flash('Текст скопирован'); }}>Копировать текст</button></div>
            <div className="hint" style={{ marginTop:6 }}>Использован раз: {d.used}</div></div>}
        </div>
        <div className="mf">
          {!isNew && <button className="btn" onClick={() => onDelete(d)} style={{ color:'var(--red)' }}>Удалить</button>}
          {!isNew && <button className="btn" onClick={() => onDup(d)}>Дублировать</button>}
          <span className="sp" style={{ flex:1 }} />
          <button className="btn primary" disabled={!ok} title={ok ? '' : 'Заполните: ' + missing.join(', ')} onClick={() => onSave(d)}>Сохранить</button>
        </div>
      </div>
    </div>
  );
}

function TemplatesPage({ go }) {
  const [tpls, setT] = useState(loadT), [q, setQ] = useState(''), [types, setTypes] = useState([]), [favOnly, setFav] = useState(false);
  const [f, setF] = useState({ task:[], goal:[], service:[] }), [edit, setEdit] = useState(null), [sheet, setSheet] = useState(false), [toast, setToast] = useState('');
  const setTpls = fn => setT(prev => { const n = fn(prev); try { localStorage.setItem(TKEY, JSON.stringify(n)); } catch (e) {} return n; });
  const flash = m => { setToast(m); clearTimeout(flash.t); flash.t = setTimeout(() => setToast(''), 2600); };
  const list = tpls.filter(t => (!types.length || types.includes(t.type)) && (!favOnly || t.fav)
    && (!f.task.length || f.task.includes(t.task)) && (!f.goal.length || f.goal.includes(t.goal)) && (!f.service.length || t.services.some(s => f.service.includes(s)))
    && (!q.trim() || (t.title + ' ' + t.body).toLowerCase().includes(q.trim().toLowerCase())));
  const nf = f.task.length + f.goal.length + f.service.length;
  const reset = () => { setF({ task:[], goal:[], service:[] }); setTypes([]); setFav(false); setQ(''); };
  const save = (d, keep) => { setTpls(ts => ts.some(x => x.id === d.id) ? ts.map(x => x.id === d.id ? d : x) : [d, ...ts]); if (!keep) { setEdit(null); flash('Шаблон сохранён'); } else setEdit(d); };
  const del = d => { if (!confirm(`Удалить шаблон «${d.title}»?`)) return; setTpls(ts => ts.filter(x => x.id !== d.id)); setEdit(null); flash('Шаблон удалён'); };
  const dup = d => { const c = { ...d, id:uid('t'), title:d.title + ' (копия)', used:0, fav:false }; setTpls(ts => [c, ...ts]); setEdit({ ...c, __new:false }); flash('Копия создана'); };
  const blank = () => ({ id:uid('t'), type:'text', title:'', body:'', task:TTASKS[0], goal:TGOALS[0], services:[], media:'', used:0, fav:false });
  const isNew = edit && !tpls.some(x => x.id === edit.id);
  return (
    <div className="app">
      <Rail page="tpl" go={go} />
      <div className="main">
        <div className="top">
          <b style={{ fontSize:16, flex:'1 1 auto' }}>Библиотека шаблонов</b>
          <button className="btn primary" onClick={() => setEdit(blank())}><Ic d={P.plus} size={15} /> Новый шаблон</button>
        </div>
        <div className="tplw">
          <aside className="tfil">
            <FilterGroups f={f} setF={setF} tpls={tpls} />
            {(nf > 0 || types.length > 0 || favOnly) && <button className="btn" onClick={reset}>Сбросить фильтры</button>}
          </aside>
          <div className="tmain">
            <div className="tbar">
              <input type="search" className="tsearch" placeholder="Поиск шаблонов" value={q} onChange={e => setQ(e.target.value)} />
              <button className="btn fbtn" onClick={() => setSheet(true)}><Ic d={P.filter} size={15} /> Фильтры{nf ? ` · ${nf}` : ''}</button>
            </div>
            <div className="chips tscroll">
              <button className={!types.length && !favOnly ? 'on' : ''} onClick={() => { setTypes([]); setFav(false); }}>Все</button>
              {Object.entries(TTYPES).map(([k, [l, ic]]) => <button key={k} className={types.includes(k) ? 'on' : ''} onClick={() => setTypes(types.includes(k) ? types.filter(x => x !== k) : [...types, k])}>{l}</button>)}
              <button className={favOnly ? 'on' : ''} onClick={() => setFav(!favOnly)}>★ Избранное</button>
            </div>
            <div className="hint">Найдено: {list.length} из {tpls.length}</div>
            {list.length === 0 && <div className="card" style={{ textAlign:'center' }}><div style={{ fontSize:30 }}>🔎</div><div style={{ margin:'6px 0 10px' }}>Ничего не найдено</div><button className="btn" onClick={reset}>Сбросить фильтры</button></div>}
            <div className="tgrid">
              {list.map(t => (
                <div key={t.id} className="tcard" role="button" tabIndex={0} onClick={() => setEdit(t)} onKeyDown={e => e.key === 'Enter' && setEdit(t)}>
                  <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                    <span className="chip" style={{ background:'var(--blue-soft)', color:'var(--blue)' }}><Ic d={TTYPES[t.type][1]} size={12} /> {TTYPES[t.type][0]}</span>
                    <span className="sp" style={{ flex:1 }} />
                    <button className="x" aria-label="Избранное" style={{ fontSize:18, color:t.fav ? 'var(--amber)' : 'var(--mute)' }} onClick={e => { e.stopPropagation(); setTpls(ts => ts.map(x => x.id === t.id ? { ...x, fav:!x.fav } : x)); }}>{t.fav ? '★' : '☆'}</button>
                  </div>
                  {t.type !== 'text' && <div className="tmedia" style={{ background:grad(t.id) }}><Ic d={TTYPES[t.type][1]} size={26} /><span className="tn2">{t.media}</span></div>}
                  <b style={{ fontSize:15, lineHeight:1.3 }}>{t.title}</b>
                  <div className="tex">{fillVars(t.body)}</div>
                  <div className="chips" style={{ gap:4 }}>
                    <span className="tg">{t.task}</span><span className="tg">{t.goal}</span>{t.services.map(s => <span className="tg" key={s}>{s}</span>)}
                  </div>
                  <div className="hint">Использован: {t.used}</div>
                </div>))}
            </div>
          </div>
        </div>
        {toast && <div className="toast">{toast}</div>}
      </div>
      {edit && <TplEditor key={edit.id} t={edit} isNew={isNew} onSave={save} onClose={() => setEdit(null)} onDelete={del} onDup={dup} flash={flash} />}
      {sheet && (
        <div className="ov sheetov" onClick={() => setSheet(false)}>
          <div className="sheetf" onClick={e => e.stopPropagation()}>
            <div className="mh"><b style={{ fontSize:16 }}>Фильтры</b><span className="sp" />{nf > 0 && <button className="lnk" onClick={() => setF({ task:[], goal:[], service:[] })}>Сбросить</button>}<button className="x" onClick={() => setSheet(false)} aria-label="Закрыть">✕</button></div>
            <div className="mb"><FilterGroups f={f} setF={setF} tpls={tpls} /></div>
            <div className="mf"><button className="btn primary" style={{ flex:1, justifyContent:'center' }} onClick={() => setSheet(false)}>Показать: {list.length}</button></div>
          </div>
        </div>)}
    </div>
  );
}

function App() {
  const [page, setPage] = useState(() => { try { return localStorage.getItem('st96-page') || 'funnel'; } catch (e) { return 'funnel'; } });
  const go = p => { setPage(p); try { localStorage.setItem('st96-page', p); } catch (e) {} };
  return page === 'tpl' ? <TemplatesPage go={go} /> : page === 'agent' ? <AgentPage go={go} /> : page === 'schedule' ? <SchedulePage go={go} /> : <ReactFlowProvider><Builder go={go} /></ReactFlowProvider>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
