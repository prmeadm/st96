<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f5bff">
<title>ST96 — конструктор воронок (прототип)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/reactflow@11.11.4/dist/style.css">
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#14171f; --mute:#6b7280; --line:#e3e6ec;
  --blue:#2f5bff; --blue-soft:#eaf0ff; --green:#19a463; --green-soft:#e6f6ee;
  --amber:#e8890c; --amber-soft:#fff3e1; --violet:#7c4dff; --violet-soft:#efe9ff;
  --red:#e5484d; --red-soft:#fdecec; --teal:#0f9aa8; --teal-soft:#e2f5f7;
  --shadow:0 1px 2px rgba(20,23,31,.06),0 6px 18px rgba(20,23,31,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --card:#181b22; --ink:#eceef3; --mute:#98a1b3; --line:#2a2f3a;
    --blue:#6c8cff; --blue-soft:#1c2748; --green:#3ecb8a; --green-soft:#12301f;
    --amber:#f2a33a; --amber-soft:#35260d; --violet:#9d7dff; --violet-soft:#241d44;
    --red:#ff6b70; --red-soft:#3a1618; --teal:#37c3d1; --teal-soft:#10303a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
/* поля без своего класса: цвета темы (нулевая специфичность, классы переопределяют) */
:where(input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]),textarea,select){background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
::placeholder{color:var(--mute);opacity:.75}
select option{background:var(--card);color:var(--ink)}
.app{display:flex;height:100%}
.rail{width:56px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px;flex:none}
.rail .logo{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--card);display:grid;place-items:center;font-weight:700;font-size:12px;margin-bottom:8px}
.rail button{width:38px;height:38px;border-radius:10px;border:0;background:none;display:grid;place-items:center;color:var(--mute)}
.rail button:hover{background:var(--bg)}
.rail button.on{background:var(--blue-soft);color:var(--blue)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:56px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px;flex:none}
.top input.name{border:1px solid transparent;background:none;font-size:16px;font-weight:600;padding:6px 8px;border-radius:8px;min-width:120px;width:300px;max-width:30vw}
.top input.name:hover,.top input.name:focus{border-color:var(--line);outline:none}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:default}
.btn.icon{padding:8px}
.pill{font-size:12px;color:var(--mute)}
.switch{display:inline-flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;user-select:none}
.switch .trk{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:.15s}
.switch .trk::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch.on .trk{background:var(--violet)}
.switch.on .trk::after{left:16px}
.switch b{font-weight:600}
.stage{flex:1;position:relative;min-height:0}
.react-flow{background:var(--bg)}
.react-flow__attribution{display:none}
.react-flow__edge-path{stroke:#aab1c0;stroke-width:1.6}
.react-flow__edge.selected .react-flow__edge-path{stroke:var(--blue);stroke-width:2.2}
.react-flow__handle{width:12px;height:12px;background:var(--card);border:2px solid #aab1c0}
.react-flow__handle.connectionindicator:hover{border-color:var(--blue)}
.react-flow__handle-right{right:-7px}
.react-flow__handle-left{left:-7px}
.react-flow__controls{box-shadow:var(--shadow);border-radius:10px;overflow:hidden}
.react-flow__controls-button{background:var(--card);border-color:var(--line);fill:var(--ink)}
.react-flow__minimap{border-radius:10px;overflow:hidden;box-shadow:var(--shadow);background:var(--card)}
.react-flow__background pattern circle{fill:var(--line)}

/* nodes */
.node{width:270px;background:var(--card);border:1.5px solid transparent;border-radius:16px;box-shadow:var(--shadow);position:relative}
.node.sel{border-color:var(--blue)}
.node.bad{border-color:var(--red)}
.node.ghost{opacity:.55}
.node .hd{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;font-weight:600}
.node .hd .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none}
.node .hd .cnt{margin-left:auto;font-size:12px;font-weight:500;color:var(--mute);display:flex;align-items:center;gap:3px}
.node .bd{padding:0 10px 10px;display:flex;flex-direction:column;gap:6px}
.bubble{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.35;white-space:pre-wrap;word-break:break-word}
.media{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:12.5px;color:var(--mute)}
.dash{border:1.5px dashed var(--line);border-radius:12px;padding:8px;text-align:center;color:var(--mute);font-size:12.5px}
.row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;background:var(--card)}
.row small{color:var(--mute);font-size:11px}
.row.link{border-radius:10px;color:var(--blue)}
.row.err{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.out{position:relative;display:flex;justify-content:flex-end;align-items:center;font-size:12px;color:var(--mute);padding:2px 4px;min-height:20px}
.out.yes{color:var(--green)}
.out.no{color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--violet-soft);color:var(--violet);font-weight:600}
.warn{font-size:12px;color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:5px 8px}
.errline{font-size:12px;color:var(--red)}
.note{width:240px;background:#efe3ff;border-radius:12px;padding:10px 12px;font-size:13px;box-shadow:var(--shadow);min-height:60px;white-space:pre-wrap;border:1.5px solid transparent;color:#2b1d4d}
.note.sel{border-color:var(--violet)}
.note.empty{opacity:.7}
.startnode{width:270px}
.startnode .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:var(--card);border-radius:10px;padding:4px 10px;margin:0 0 -4px 6px;box-shadow:var(--shadow)}

/* panel */
.panel{position:absolute;top:12px;right:12px;bottom:12px;width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:20}
.panel .ph{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.panel .pb{padding:14px 16px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.panel .pf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.fld label{display:block;font-size:12px;color:var(--mute);margin-bottom:5px;font-weight:500}
.fld input[type=text],.fld textarea,.fld select,.fld input[type=number],.fld input[type=url]{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card)}
.fld textarea{resize:vertical;min-height:84px}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:2px solid var(--blue-soft);border-color:var(--blue)}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:6px 8px;font-size:13px}
.seg button.on{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.item .ih{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.x{border:0;background:none;color:var(--mute);padding:2px 6px;border-radius:6px}
.x:hover{background:var(--red-soft);color:var(--red)}
.addrow{display:flex;flex-wrap:wrap;gap:6px}
.addrow button{border:1px dashed var(--line);background:none;border-radius:10px;padding:6px 10px;font-size:13px;color:var(--ink)}
.addrow button:hover{border-color:var(--blue);color:var(--blue)}
.h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600}
.hint{font-size:12px;color:var(--mute);line-height:1.4}
.aibox{background:var(--violet-soft);color:var(--violet);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.4}

/* add menu */
.dock{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:15;display:flex;gap:8px;align-items:center}
.menu{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);width:330px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px;z-index:30}
.menu button{display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;background:none;width:100%;padding:8px;border-radius:10px}
.menu button:hover{background:var(--bg)}
.menu .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.menu b{display:block;font-weight:600}
.menu span.d{font-size:12px;color:var(--mute);line-height:1.3}
.menu .sep{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding:8px 8px 2px;font-weight:600}
.legend{position:absolute;left:12px;top:12px;z-index:10;display:flex;gap:8px}

/* preview */
.ov{position:fixed;inset:0;background:rgba(10,12,18,.55);z-index:100;display:grid;place-items:center}
.phone{width:380px;max-width:94vw;height:min(720px,92vh);background:var(--card);border-radius:28px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.phone .ph{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);font-weight:600}
.phone .av{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font-size:11px;font-weight:700}
.chat{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.msg{max-width:84%;background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:9px 12px;line-height:1.38;white-space:pre-wrap;align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff;border-color:var(--blue);border-radius:16px 16px 4px 16px}
.msg .lnk{display:block;margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--blue);text-align:center;font-weight:500}
.sys{align-self:center;font-size:12px;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.opts{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;max-height:40%;overflow:auto}
.opts button{border:1px solid var(--blue);color:var(--blue);background:var(--card);border-radius:12px;padding:9px 12px;font-weight:500}
.opts button:hover{background:var(--blue-soft)}
.booking{align-self:flex-start;width:84%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 14px;border-radius:10px;z-index:50;font-size:13px}
@media (max-width:820px){.panel{left:8px;right:8px;width:auto;top:auto;height:55%}.top .hide-s{display:none}}

/* schedule */
.pagebody{flex:1;overflow:auto;padding:18px}
.two{display:grid;grid-template-columns:minmax(360px,1fr) minmax(380px,1fr);gap:16px;max-width:1240px;margin:0 auto}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:15px}
.wrow{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.wrow:first-of-type{border-top:0}
.tin{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--card)}
.lnk{border:0;background:none;color:var(--blue);padding:0;font-size:12.5px;text-align:left}
.lnk:hover{text-decoration:underline}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px}
.chips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.g7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dn{text-align:center;font-size:11px;color:var(--mute);padding:4px 0;font-weight:600}
.cell{position:relative;aspect-ratio:1/0.82;border:1px solid var(--line);border-radius:10px;background:var(--card);display:grid;place-items:center;font-weight:500;padding:0}
.cell.open{background:var(--green-soft);border-color:transparent;color:var(--green)}
.cell.closed{background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 5px,var(--line) 5px,var(--line) 6px);color:var(--mute)}
.cell.dis{background:var(--bg);color:var(--mute);opacity:.55;border-color:transparent}
.cell.out{opacity:.35}
.cell.sel{outline:2px solid var(--blue);outline-offset:1px;opacity:1}
.cell:disabled{cursor:default}
.dot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--blue);display:inline-block}
.bdg{position:absolute;bottom:3px;right:4px;font-style:normal;font-size:10px;background:var(--blue);color:#fff;border-radius:999px;min-width:16px;text-align:center;padding:0 4px;display:inline-block}
.legend2{display:flex;gap:14px;font-size:12px;color:var(--mute);margin:-4px 0 10px;flex-wrap:wrap;align-items:center}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.legend2 .dot,.legend2 .bdg{position:static}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}
.sw.open{background:var(--green-soft);border:1px solid var(--green)}
.sw.closed{background:var(--line)}
.rangebox{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{border:1px solid var(--green);background:var(--green-soft);color:var(--green);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:500}
.slot.off{border-color:var(--line);background:var(--bg);color:var(--mute);text-decoration:line-through;cursor:default}
.slot.pick{background:var(--blue);border-color:var(--blue);color:#fff}
.kv{display:grid;grid-template-columns:100px 1fr;gap:6px 12px;margin-top:12px;font-size:13px}
.kv span{color:var(--mute)}
.kv b{font-weight:500}
.wcard{max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.rail .rl,.sheet-grip,.show-s{display:none}
.act{justify-content:center}
/* templates */
.tplw{flex:1;min-height:0;display:grid;grid-template-columns:270px 1fr}
.tfil{border-right:1px solid var(--line);overflow:auto;padding:16px;background:var(--card);display:flex;flex-direction:column;gap:18px}
.tmain{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tmain>*{flex:none}
.fld label.btn{display:flex;font-size:14px;color:var(--ink);margin:0;font-weight:500;justify-content:center;width:100%}
.tbar{display:flex;gap:8px}
.tsearch{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--card)}
.tsearch:focus{outline:2px solid var(--blue-soft);border-color:var(--blue)}
.fbtn{display:none}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;box-shadow:var(--shadow);text-align:left}
.tcard:hover{border-color:var(--blue)}
.tex{font-size:13px;color:var(--mute);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tg{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--mute);border:1px solid var(--line)}
.tmedia{aspect-ratio:16/9;border-radius:12px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;color:#fff}
.tmedia.sm{aspect-ratio:auto;height:90px;margin-bottom:8px}
.tn2{font-size:12px;opacity:.9}
.tgprev{background:var(--bg);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:10px 12px;line-height:1.4;max-width:92%}
.tscroll{flex-wrap:wrap}
.sheetov{display:none}

/* agent tasks */
.agent{flex:1;min-height:0;display:grid;grid-template-columns:340px 1fr}
.alist{border-right:1px solid var(--line);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.atask{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;width:100%}
.atask.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.adetail{overflow:auto;padding:18px 18px 0;display:flex;flex-direction:column;gap:14px;min-width:0}
.adetail>*{max-width:820px;width:100%;margin-left:auto;margin-right:auto;flex:none}
.adetail>.card[style*="margin:auto"]{margin:auto}
.step{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--bg);flex:none;margin-top:2px}
.step.done .n{background:var(--green-soft);color:var(--green)}
.step.run .n{background:var(--blue-soft);color:var(--blue)}
.step.off,.step.skipped{opacity:.5}
.step .stx{width:100%;border:1px solid transparent;background:none;border-radius:8px;padding:4px 6px;margin-left:-6px;resize:none;overflow:hidden;line-height:1.4;min-height:0!important}
.step .stx:hover,.step .stx:focus{border-color:var(--line);outline:none;background:var(--card)}
.pbar{height:8px;border-radius:8px;background:var(--bg);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--blue);transition:width .4s}
.actbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.actbar.sticky{position:sticky;bottom:0;padding:12px 0 14px;background:linear-gradient(transparent,var(--bg) 22%)}
.logl{font-size:12.5px;color:var(--mute);display:flex;gap:8px}
.logl time{flex:none;font-variant-numeric:tabular-nums}
.spin{width:12px;height:12px;border:2px solid var(--violet-soft);border-top-color:var(--violet);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.back{display:none}
.modal{width:min(640px,94vw);max-height:92vh;background:var(--card);border-radius:20px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4);overflow:hidden}
.mh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}

    <div className={`node ${selected ? 'sel' : ''} ${errs.length && !ghost ? 'bad' : ''} ${ghost ? 'ghost' : ''}`}>
      {type !== 'start' && <Handle id="in" type="target" position={Position.Left} style={{ top:22 }} />}
      <div className="hd">
        <span className="ic" style={{ background:t.soft, color:t.color }}><Ic d={t.icon} size={14} /></span>
        <span>{t.name}</span>
        {type === 'ai' && <span className="chip">необязательно</span>}
        {data.count != null && <span className="cnt" title="Прошли блок"><Ic d={P.user} size={12} />{data.count}</span>}
      </div>
      <div className="bd">
        {ghost && <div className="warn">ИИ выключен для этой воронки — шаг будет пропущен</div>}
        {children}
        {errs.length > 0 && !ghost && type !== 'condition' && errs.map((e, i) => <div className="errline" key={i}>● {e}</div>)}
      </div>
    </div>
  );
}
const OutHandle = ({ id, label, cls, top }) => (
  <div className={`out ${cls || ''}`}>{label}<Handle id={id} type="source" position={Position.Right} style={{ top: top || '50%' }} /></div>
);

function ConditionNode({ id, data, selected }) {

function ActionNode({ id, data, selected }) {

function newNode(type, position) {

function Grouped({ items, onPick, label }) {

/* ───────── preview ───────── */
function Preview({ nodes, edges, aiEnabled, onClose }) {
  const [log, setLog] = useState([]);
  const [opts, setOpts] = useState([]);
  const endRef = useRef(null);
  const byId = id => nodes.find(n => n.id === id);
  const next = (id, h) => edges.find(e => e.source === id && (e.sourceHandle || 'out') === h)?.target;

  const advance = (startId) => {
    const items = []; let choices = []; let id = startId; let guard = 0;
    while (id && guard++ < 60) {
      const n = byId(id); if (!n) break;
      const d = n.data;
      if (n.type === 'start') { id = next(id, 'out'); continue; }
      if (n.type === 'message') {
        items.push({ k:'bot', parts:d.parts, links:d.links });
        if (d.quick.length) { choices = d.quick.map(q => ({ label:q.label || '…', target:next(id, 'qr-' + q.id) })); break; }
        id = next(id, 'out'); continue;
      }
      if (n.type === 'condition') {
        items.push({ k:'sys', t:'Проверка: ' + (d.rules.map(condText).join(d.mode === 'all' ? ' И ' : ' ИЛИ ') || 'условие не задано') });
        choices = [{ label:'Условие выполнено (демо)', target:next(id, 'yes') }, { label:'Не выполнено (демо)', target:next(id, 'no') }]; break;
      }
      if (n.type === 'action') { d.items.forEach(a => items.push({ k:'sys', t:'Действие: ' + actText(a) })); id = next(id, 'out'); continue; }
      if (n.type === 'ai') {
        if (!aiEnabled) { items.push({ k:'sys', t:'ИИ выключен — шаг пропущен' }); id = next(id, 'out'); continue; }
        items.push({ k:'sys', t:'ИИ отвечает по базе знаний' });
        items.push({ k:'bot', parts:[{ id:'ai', kind:'text', text:'Это демо-ответ ИИ. В рабочей версии здесь ответ Claude на вопрос клиента по услугам студии.' }], links:[] });
        id = next(id, 'out'); continue;
      }
      if (n.type === 'booking') {
        items.push({ k:'booking', d });
        choices = [{ label:'Админ подтвердил время (демо)', target:next(id, 'confirmed') }, { label:'Админ отклонил / другое время (демо)', target:next(id, 'declined') }]; break;
      }
      if (n.type === 'handoff') { items.push({ k:'bot', parts:[{ id:'h', kind:'text', text:d.message }], links:[] }); items.push({ k:'sys', t:'Диалог передан администратору' }); break; }
      break;
    }
    if (!choices.length && !items.some(i => i.t === 'Диалог передан администратору')) items.push({ k:'sys', t:'Конец воронки' });
    return { items, choices };
  };

  const start = () => { const r = advance('start'); setLog(r.items); setOpts(r.choices); };
  useEffect(start, []);

  };

  return (
    <div className="ov" onClick={onClose}>
      <div className="phone" onClick={e => e.stopPropagation()}>

          {log.map((m, i) => m.k === 'sys' ? <div className="sys" key={i}>{m.t}</div>
            : m.k === 'me' ? <div className="msg me" key={i}>{m.t}</div>
            : m.k === 'booking' ? (
              <div className="booking" key={i}>

                {m.links.map(l => <span className="lnk" key={l.id}>{l.label || 'Ссылка'}</span>)}

  );
}

/* ───────── layout ───────── */
function autoLayout(nodes, edges) {
  const start = nodes.find(n => n.type === 'start'); if (!start) return nodes;
  const layer = { [start.id]: 0 }; const q = [start.id];
  while (q.length) { const id = q.shift(); edges.filter(e => e.source === id).forEach(e => { if (layer[e.target] == null) { layer[e.target] = layer[id] + 1; q.push(e.target); } }); }
  let extra = Math.max(0, ...Object.values(layer)) + 1;
  const cols = {};
  nodes.forEach(n => { const l = layer[n.id] ?? (n.type === 'note' ? extra : extra); (cols[l] = cols[l] || []).push(n); });
  const pos = {};
  Object.entries(cols).forEach(([l, arr]) => { let y = 0; arr.forEach(n => { pos[n.id] = { x:+l * 380, y }; y += (n.height || 160) + 40; }); });
  return nodes.map(n => ({ ...n, position: pos[n.id] || n.position }));
}

const DOW = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const FORMATS = ['Телефонный звонок','Видеозвонок','Офлайн встреча'];
const pad = n => String(n).padStart(2, '0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const dowOf = d => (d.getDay() + 6) % 7;
const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const tm = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const hm = n => `${pad(Math.floor(n / 60))}:${pad(n % 60)}`;
const longDate = d => `${d.getDate()} ${MONTHS[d.getMonth()].toLowerCase().replace(/ь$/, 'я').replace(/т$/, 'та').replace(/й$/, 'я')}, ${DOW[dowOf(d)]}`;

const SKEY = 'st96-schedule-v1', BKEY = 'st96-bookings-v1';
function defaultSchedule() {
  const week = {};
  for (let i = 0; i < 5; i++) week[i] = { on:true, windows:[{ from:'10:00', to:'13:00' }, { from:'14:00', to:'18:00' }] };
  week[5] = { on:true, windows:[{ from:'11:00', to:'15:00' }] };
  week[6] = { on:false, windows:[{ from:'11:00', to:'15:00' }] };
  const today = sod(new Date());
  const overrides = {};
  const nov7 = new Date(today.getFullYear(), 10, 7);
  if (nov7 >= today) overrides[ds(nov7)] = { closed:true, reason:'Праздничный день' };
  let fri = addDays(today, 1); while (dowOf(fri) !== 4) fri = addDays(fri, 1);
  overrides[ds(fri)] = { blocks:[{ from:'14:00', to:'16:00', reason:'Выездная съёмка' }] };
  return {
    week, overrides, google:true,
    googleBusy:{ 2:[{ from:'15:00', to:'16:30', title:'Личное' }] },
    rules:{ step:30, buffer:15, minNotice:3, horizon:45, maxPerDay:5,
      durations:{ 'Ретушь':30, 'Нейрофотосессия':60, 'Съёмка':60, 'Цветокоррекция':30, 'Другое':30 },
      offlineDays:[1, 3] },
  };
}
function loadS() { try { const s = JSON.parse(localStorage.getItem(SKEY)); if (s && s.week) return s; } catch (e) {} return defaultSchedule(); }
function seedBookings() {
  const today = sod(new Date());
  let a = addDays(today, 2); while (dowOf(a) > 4) a = addDays(a, 1);
  let b = addDays(today, 3); while (dowOf(b) !== 1 && dowOf(b) !== 3) b = addDays(b, 1);
  const mk = (id, date, time, service, format, name, company, status) => ({
    id, date:ds(date), time, service, format, name, company, telegram:'@' + name.toLowerCase(), phone:'+375 29 000-00-00',
    goal:'Обсудить задачу и сроки', comment:'', status,
    meet: format === 'Видеозвонок' ? 'https://meet.google.com/abc-defg-hij' : '',
    log: status === 'pending'
      ? [{ to:'client', t:'Заявка принята и находится на рассмотрении у администратора студии.' }, { to:'admin', t:`Новая заявка: ${name}, ${company}. Подтвердить время?` }]
      : [{ to:'client', t:'Администратор студии принял время и дату, просим не опаздывать.' }],
  });
  return [
    mk('b1', a, '11:00', 'Ретушь', 'Видеозвонок', 'Анна', 'Студия «Лето»', 'pending'),
    mk('b2', b, '15:00', 'Нейрофотосессия', 'Офлайн встреча', 'Игорь', 'ООО «Вектор»', 'confirmed'),
  ];
}
function loadB() { try { const s = JSON.parse(localStorage.getItem(BKEY)); if (Array.isArray(s)) return s; } catch (e) {} return seedBookings(); }

/* Сервер считает слоты так же: правила → закрытые дни → Google → заявки → лимиты */
function dayInfo(date, S, bookings, service, format, now = new Date()) {
  const key = ds(date), ov = S.overrides[key] || {}, R = S.rules;
  if (date < sod(now)) return { closed:true, why:'Прошедший день', slots:[], past:true };
  if (date > addDays(sod(now), R.horizon)) return { closed:true, why:'За пределами горизонта записи', slots:[], far:true };
  if (ov.closed) return { closed:true, why:ov.reason || 'Закрыт вручную', slots:[], manual:true };
  const dow = dowOf(date);
  if (format === 'Офлайн встреча' && !R.offlineDays.includes(dow)) return { closed:true, why:'Офлайн-встречи в этот день не проводятся', slots:[] };
  const wins = ov.windows && ov.windows.length ? ov.windows : (ov.open ? [{ from:'10:00', to:'18:00' }] : (S.week[dow].on ? S.week[dow].windows : []));
  if (!wins.length) return { closed:true, why:'Выходной по расписанию', slots:[] };
  const dur = R.durations[service] || 30;
  const busy = [];
  (ov.blocks || []).forEach(b => busy.push([tm(b.from), tm(b.to), b.reason || 'Закрыто вручную']));
  if (S.google) (S.googleBusy[dow] || []).forEach(b => busy.push([tm(b.from) - R.buffer, tm(b.to) + R.buffer, 'Занято в Google Calendar']));
  const dayB = bookings.filter(b => b.date === key && b.status !== 'rejected');
  dayB.forEach(b => busy.push([tm(b.time) - R.buffer, tm(b.time) + (R.durations[b.service] || 30) + R.buffer, 'Уже есть заявка']));
  const limit = dayB.length >= R.maxPerDay;
  const earliest = new Date(now.getTime() + R.minNotice * 3600000);
  const slots = [];
  wins.forEach(w => {
    for (let s = tm(w.from); s + dur <= tm(w.to); s += R.step) {
      let why = '';
      const at = new Date(date.getFullYear(), date.getMonth(), date.getDate(), Math.floor(s / 60), s % 60);
      if (at < earliest) why = 'Слишком скоро';
      else if (limit) why = 'Лимит встреч на день';
      else { const c = busy.find(([a, b]) => s < b && s + dur > a); if (c) why = c[2]; }
      slots.push({ t:hm(s), free:!why, why });
    }
  });
  return { closed:false, slots, wins, free:slots.filter(x => x.free).length };
}

function downloadIcs(b, S) {
  const d = b.date.replace(/-/g, ''), st = d + 'T' + b.time.replace(':', '') + '00';
  const en = d + 'T' + hm(tm(b.time) + (S.rules.durations[b.service] || 30)).replace(':', '') + '00';
  const esc = t => String(t).replace(/([,;])/g, '\\$1').replace(/\n/g, '\\n');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//ST96//Booking//RU', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
    `UID:${b.id}@st96.by`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`,
    `DTSTART;TZID=Europe/Minsk:${st}`, `DTEND;TZID=Europe/Minsk:${en}`,
    `SUMMARY:${esc('Встреча со студией ST96: ' + b.service)}`,
    `DESCRIPTION:${esc(`Формат: ${b.format}\nЦель: ${b.goal}${b.meet ? '\nGoogle Meet: ' + b.meet : ''}`)}`,
    b.meet ? `URL:${b.meet}` : '', b.format === 'Офлайн встреча' ? 'LOCATION:Студия ST96' : '',
    'BEGIN:VALARM', 'TRIGGER:-PT1H', 'ACTION:DISPLAY', 'DESCRIPTION:Через час встреча со студией ST96', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'].filter(Boolean);
  const url = URL.createObjectURL(new Blob([lines.join('\r\n')], { type:'text/calendar' }));
  const a = document.createElement('a'); a.href = url; a.download = `st96-${b.date}-${b.time.replace(':', '')}.ics`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

      <div className="g7">{DOW.map(x => <div className="dn" key={x}>{x}</div>)}</div>
      <div className="g7">
        {cells.map(d => {
          const c = cell(d), out = d.getMonth() !== cursor.getMonth();
          return (
            <button key={ds(d)} disabled={c.disabled} onClick={() => onPick(d)}
              className={`cell ${c.cls || ''} ${out ? 'out' : ''} ${selected === ds(d) ? 'sel' : ''}`} title={c.title || ''}>
              <span>{d.getDate()}</span>
              {c.badge != null && <i className="bdg">{c.badge}</i>}
              {c.dot && <i className="dot" />}
            </button>
          );
        })}
      </div>
    </div>
  );
}

const TimeRange = ({ w, onChange, onDel }) => (
  <div style={{ display:'flex', alignItems:'center', gap:6 }}>
    <input type="time" className="tin" value={w.from} onChange={e => onChange({ ...w, from:e.target.value })} />
    <span>—</span>
    <input type="time" className="tin" value={w.to} onChange={e => onChange({ ...w, to:e.target.value })} />
    {onDel && <button className="x" onClick={onDel} aria-label="Удалить окно">✕</button>}
  </div>
);
const Sw = ({ on, onChange, label }) => (
  <div className={`switch ${on ? 'on' : ''}`} role="switch" aria-checked={on} tabIndex={0} onClick={() => onChange(!on)}
    onKeyDown={e => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), onChange(!on))}>
    <span className="trk" />{label && <span>{label}</span>}
  </div>
);

function SettingsTab({ S, setS, bookings, flash }) {
  const [cursor, setCursor] = useState(() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), 1); });
  const [sel, setSel] = useState(ds(new Date()));
  const [svc, setSvc] = useState('Ретушь');
  const [rf, setRf] = useState(''), [rt, setRt] = useState(''), [rr, setRr] = useState('Отпуск');
  const [blk, setBlk] = useState({ from:'14:00', to:'16:00' });
  const R = S.rules;
  const upW = (i, p) => setS({ ...S, week:{ ...S.week, [i]:{ ...S.week[i], ...p } } });
  const upR = p => setS({ ...S, rules:{ ...R, ...p } });
  const setOv = (key, p) => {
    const ov = { ...(S.overrides[key] || {}), ...p };
    ['closed', 'open'].forEach(k => { if (!ov[k]) delete ov[k]; });
    if (!ov.windows || !ov.windows.length) delete ov.windows;
    if (!ov.blocks || !ov.blocks.length) delete ov.blocks;
    const o = { ...S.overrides };
    if (Object.keys(ov).length) o[key] = ov; else delete o[key];
    setS({ ...S, overrides:o });
  };
  const date = parseD(sel), key = sel, ov = S.overrides[key] || {};
  const info = dayInfo(date, S, bookings, svc, null);
  const defOpen = S.week[dowOf(date)].on;
  const isOpen = !info.closed;
  const toggleDay = v => setOv(key, v === defOpen ? { closed:false, open:false } : (v ? { closed:false, open:true } : { closed:true, open:false }));
  const closeRange = () => {
    if (!rf || !rt || rt < rf) return flash('Укажите даты: «с» не позже «по»');
    const o = { ...S.overrides }; let n = 0;
    for (let d = parseD(rf); d <= parseD(rt); d = addDays(d, 1)) { o[ds(d)] = { ...(o[ds(d)] || {}), closed:true, reason:rr }; n++; }
    setS({ ...S, overrides:o }); flash(`Закрыто дней: ${n}`);
  };
  const holidays = () => {
    const y = new Date().getFullYear(), o = { ...S.overrides }; let n = 0;
    [y, y + 1].forEach(yy => [[0, 1, 'Новый год'], [0, 7, 'Рождество'], [2, 8, '8 Марта'], [4, 1, 'Праздник труда'], [4, 9, 'День Победы'], [6, 3, 'День Независимости'], [10, 7, 'Октябрьская революция'], [11, 25, 'Католическое Рождество']]
      .forEach(([m, d, r]) => { const x = new Date(yy, m, d); if (x >= sod(new Date())) { o[ds(x)] = { ...(o[ds(x)] || {}), closed:true, reason:r }; n++; } }));
    setS({ ...S, overrides:o }); flash(`Закрыто праздничных дней: ${n}. Переносные даты проверьте вручную`);
  };
  const cell = d => {
    const i = dayInfo(d, S, bookings, svc, null), o = S.overrides[ds(d)];
    const nb = bookings.filter(b => b.date === ds(d) && b.status !== 'rejected').length;
    return { cls: i.past || i.far ? 'dis' : i.closed ? 'closed' : 'open', dot:!!o, badge:nb || null, title:i.closed ? i.why : `Свободно слотов: ${i.free}` };
  };

  return (
    <div className="two">
      <div className="col">
        <div className="card">
          <h3>Рабочие часы по дням недели</h3>
          {DOW.map((n, i) => (
            <div className="wrow" key={i}>
              <div style={{ width:44 }}><b>{n}</b></div>
              <Sw on={S.week[i].on} onChange={v => upW(i, { on:v })} />
              <div style={{ flex:1, display:'flex', flexDirection:'column', gap:6 }}>
                {S.week[i].on
                  ? <>{S.week[i].windows.map((w, k) => <TimeRange key={k} w={w} onChange={nw => upW(i, { windows:S.week[i].windows.map((x, j) => j === k ? nw : x) })}
                      onDel={S.week[i].windows.length > 1 ? () => upW(i, { windows:S.week[i].windows.filter((_, j) => j !== k) }) : null} />)}
                    <button className="lnk" onClick={() => upW(i, { windows:[...S.week[i].windows, { from:'14:00', to:'18:00' }] })}>+ добавить окно (перерыв между окнами)</button></>
                  : <span className="hint">Выходной</span>}
              </div>
            </div>
          ))}
        </div>
        <div className="card">
          <h3>Правила слотов</h3>
          <div className="fgrid">
            <div className="fld"><label>Шаг сетки</label><select value={R.step} onChange={e => upR({ step:+e.target.value })}>{[15, 30, 60].map(x => <option key={x} value={x}>{x} мин</option>)}</select></div>
            <div className="fld"><label>Буфер между встречами</label><select value={R.buffer} onChange={e => upR({ buffer:+e.target.value })}>{[0, 5, 10, 15, 30].map(x => <option key={x} value={x}>{x} мин</option>)}</select></div>
            <div className="fld"><label>Записаться не раньше чем за, ч</label><input type="number" min="0" value={R.minNotice} onChange={e => upR({ minNotice:+e.target.value })} /></div>
            <div className="fld"><label>Горизонт записи, дней</label><input type="number" min="1" max="365" value={R.horizon} onChange={e => upR({ horizon:+e.target.value })} /></div>
            <div className="fld"><label>Максимум встреч в день</label><input type="number" min="1" value={R.maxPerDay} onChange={e => upR({ maxPerDay:+e.target.value })} /></div>
          </div>
          <div className="h2" style={{ marginTop:14 }}>Длительность по услугам</div>
          <div className="fgrid" style={{ marginTop:8 }}>
            {SERVICES.map(s => <div className="fld" key={s}><label>{s}</label>
              <select value={R.durations[s]} onChange={e => upR({ durations:{ ...R.durations, [s]:+e.target.value } })}>{[15, 30, 45, 60, 90, 120].map(x => <option key={x} value={x}>{x} мин</option>)}</select></div>)}
          </div>
        </div>
        <div className="card">
          <h3>Форматы и синхронизация</h3>
          <div className="fld"><label>Офлайн-встречи проходят только в дни</label>
            <div className="chips">{DOW.map((n, i) => <button key={i} className={R.offlineDays.includes(i) ? 'on' : ''}
              onClick={() => upR({ offlineDays:R.offlineDays.includes(i) ? R.offlineDays.filter(x => x !== i) : [...R.offlineDays, i] })}>{n}</button>)}</div>
            <div className="hint" style={{ marginTop:6 }}>Звонок и видеозвонок доступны в любой рабочий день.</div></div>
          <div style={{ marginTop:14 }}><Sw on={S.google} onChange={v => setS({ ...S, google:v })} label="Учитывать занятость из Google Calendar" /></div>
          <div className="hint" style={{ marginTop:6 }}>В демо занято по средам 15:00–16:30 («Личное»). В рабочей версии события читаются из календаря st96adm@gmail.com.</div>
        </div>
      </div>

      <div className="col">
        <div className="card">
          <h3>Календарь: открытые и закрытые дни</h3>
          <div className="legend2"><span><i className="sw open" />открыт</span><span><i className="sw closed" />закрыт</span><span><i className="dot" />исключение</span><span><i className="bdg">2</i>заявки</span></div>
          <MonthGrid cursor={cursor} setCursor={setCursor} selected={sel} cell={cell} onPick={d => { setSel(ds(d)); if (d.getMonth() !== cursor.getMonth()) setCursor(new Date(d.getFullYear(), d.getMonth(), 1)); }} />
          <div className="rangebox">
            <div className="h2">Закрыть период</div>
            <div style={{ display:'flex', gap:8, flexWrap:'wrap', alignItems:'flex-end', marginTop:8 }}>
              <div className="fld"><label>с</label><input type="date" className="tin" value={rf} onChange={e => setRf(e.target.value)} /></div>
              <div className="fld"><label>по</label><input type="date" className="tin" value={rt} onChange={e => setRt(e.target.value)} /></div>
              <div className="fld" style={{ flex:1, minWidth:120 }}><label>Причина</label><input type="text" value={rr} onChange={e => setRr(e.target.value)} /></div>
              <button className="btn" onClick={closeRange}>Закрыть</button>
            </div>
            <div style={{ display:'flex', gap:8, marginTop:10, flexWrap:'wrap' }}>
              <button className="btn" onClick={holidays}>Закрыть праздники РБ</button>
              <button className="btn" onClick={() => { setS({ ...S, overrides:{} }); flash('Все исключения сброшены'); }}>Сбросить исключения</button>
            </div>
          </div>
        </div>

        <div className="card">
          <h3>{longDate(date)}</h3>
          {info.past && <div className="hint">Прошедший день — изменить нельзя.</div>}
          {!info.past && <>
            <Sw on={isOpen && !info.far} onChange={toggleDay} label={isOpen ? 'Принимаем записи в этот день' : 'День закрыт для записи'} />
            {info.closed && <div className="hint" style={{ marginTop:6 }}>Причина: {info.why}</div>}
            {ov.closed && <div className="fld" style={{ marginTop:10 }}><label>Причина для себя</label><input type="text" value={ov.reason || ''} onChange={e => setOv(key, { reason:e.target.value })} placeholder="Отпуск, съёмка…" /></div>}
            {isOpen && <>
              <div className="h2" style={{ marginTop:14 }}>Часы приёма в этот день</div>
              {ov.windows
                ? <div style={{ display:'flex', flexDirection:'column', gap:6, marginTop:6 }}>
                    {ov.windows.map((w, k) => <TimeRange key={k} w={w} onChange={nw => setOv(key, { windows:ov.windows.map((x, j) => j === k ? nw : x) })} onDel={() => setOv(key, { windows:ov.windows.filter((_, j) => j !== k) })} />)}
                    <div style={{ display:'flex', gap:8 }}><button className="lnk" onClick={() => setOv(key, { windows:[...ov.windows, { from:'14:00', to:'18:00' }] })}>+ окно</button>
                      <button className="lnk" onClick={() => setOv(key, { windows:[] })}>вернуть по умолчанию</button></div></div>
                : <div className="hint" style={{ marginTop:4 }}>{info.wins.map(w => `${w.from}–${w.to}`).join(', ')} <button className="lnk" onClick={() => setOv(key, { windows:info.wins.map(w => ({ ...w })) })}>изменить только на этот день</button></div>}
              <div className="h2" style={{ marginTop:14 }}>Закрыть часть дня</div>
              {(ov.blocks || []).map((b, k) => <div key={k} className="item" style={{ marginTop:6, flexDirection:'row', alignItems:'center', justifyContent:'space-between' }}>
                <span>{b.from}–{b.to} {b.reason && <span className="hint">· {b.reason}</span>}</span><button className="x" onClick={() => setOv(key, { blocks:ov.blocks.filter((_, j) => j !== k) })}>✕</button></div>)}
              <div style={{ display:'flex', gap:8, alignItems:'center', marginTop:8, flexWrap:'wrap' }}>
                <TimeRange w={blk} onChange={setBlk} />
                <button className="btn" onClick={() => blk.to > blk.from ? setOv(key, { blocks:[...(ov.blocks || []), { ...blk, reason:'Закрыто вручную' }] }) : flash('Время «до» должно быть позже «от»')}>Закрыть</button>
              </div>
              <div className="h2" style={{ marginTop:14, display:'flex', alignItems:'center', gap:10 }}>Слоты для услуги
                <select className="tin" value={svc} onChange={e => setSvc(e.target.value)}>{SERVICES.map(s => <option key={s}>{s}</option>)}</select></div>
              <div className="slots" style={{ marginTop:8 }}>
                {info.slots.map(s => <span key={s.t} className={`slot ${s.free ? '' : 'off'}`} title={s.why}>{s.t}</span>)}
                {!info.slots.length && <span className="hint">Нет слотов</span>}
              </div>
              <div className="hint" style={{ marginTop:6 }}>Серые слоты заняты или закрыты: нажмите или наведите, чтобы увидеть причину.</div>
            </>}
          </>}
        </div>
      </div>
    </div>
  );
}

const STATUS = { pending:['На рассмотрении', 'var(--amber)', 'var(--amber-soft)'], confirmed:['Подтверждена', 'var(--green)', 'var(--green-soft)'], rejected:['Отклонена', 'var(--red)', 'var(--red-soft)'] };
function RequestsTab({ S, bookings, setBookings, flash }) {
  const [filter, setFilter] = useState('all');
  const list = [...bookings].filter(b => filter === 'all' || b.status === filter).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const decide = (b, ok) => {
    const meet = ok && b.format === 'Видеозвонок' && !b.meet ? 'https://meet.google.com/' + ['xxx', 'yyyy', 'zzz'].map(p => p.replace(/./g, () => 'abcdefghijkmnpqrstuvwxyz'[Math.floor(Math.random() * 24)])).join('-') : b.meet;
    const msg = ok
      ? { to:'client', t:'Администратор студии принял время и дату, просим не опаздывать.' + (meet ? ` Ссылка на видеозвонок: ${meet}` : ''), file:true }
      : { to:'client', t:'К сожалению, это время недоступно. Администратор студии свяжется с вами и предложит другое.' };
    setBookings(bookings.map(x => x.id === b.id ? { ...x, status:ok ? 'confirmed' : 'rejected', meet, log:[...x.log, msg, { to:'admin', t:ok ? 'Встреча подтверждена, событие сохранено в Google Calendar.' : 'Заявка отклонена.' }] } : x));
    flash(ok ? 'Подтверждено: клиенту ушло сообщение и файл .ics' : 'Заявка отклонена, клиент уведомлён');
  };
  return (
    <div style={{ maxWidth:860, margin:'0 auto', display:'flex', flexDirection:'column', gap:12 }}>
      <div className="seg scroll" style={{ alignSelf:'flex-start' }}>
        {[['all', 'Все'], ['pending', 'На рассмотрении'], ['confirmed', 'Подтверждённые'], ['rejected', 'Отклонённые']].map(([k, l]) =>
          <button key={k} className={filter === k ? 'on' : ''} onClick={() => setFilter(k)}>{l}{k === 'pending' ? ` (${bookings.filter(b => b.status === 'pending').length})` : ''}</button>)}
      </div>
      {list.length === 0 && <div className="card"><span className="hint">Заявок нет. Создайте тестовую во вкладке «Виджет клиента».</span></div>}
      {list.map(b => {
        const st = STATUS[b.status];
        return (
          <div className="card" key={b.id}>
            <div style={{ display:'flex', gap:10, alignItems:'center', flexWrap:'wrap' }}>
              <b style={{ fontSize:15 }}>{longDate(parseD(b.date))}, {b.time}</b>
              <span className="chip" style={{ background:st[2], color:st[1] }}>{st[0]}</span>
              <span className="sp" style={{ flex:1 }} />
              {b.status === 'pending' && <><button className="btn act" onClick={() => decide(b, false)}>Отклонить</button><button className="btn primary act" onClick={() => decide(b, true)}>Подтвердить</button></>}
              {b.status === 'confirmed' && <button className="btn act" onClick={() => downloadIcs(b, S)}>Скачать .ics</button>}
            </div>
            <div className="kv">
              <span>Услуга</span><b>{b.service} · {S.rules.durations[b.service] || 30} мин</b>
              <span>Формат</span><b>{b.format}{b.meet && b.status === 'confirmed' ? <> · <a className="lnk" href={b.meet} onClick={e => e.preventDefault()}>{b.meet}</a></> : ''}</b>
              <span>Клиент</span><b>{b.name}, {b.company}</b>
              <span>Контакты</span><b>{b.telegram} · {b.phone}</b>
              <span>Цель</span><b>{b.goal}</b>
              {b.comment && <><span>Комментарий</span><b>{b.comment}</b></>}
            </div>
            <details style={{ marginTop:10 }}><summary className="hint" style={{ cursor:'pointer' }}>Уведомления в Telegram ({b.log.length})</summary>
              <div style={{ display:'flex', flexDirection:'column', gap:6, marginTop:8 }}>
                {b.log.map((m, i) => <div key={i} className="hint" style={{ background:'var(--bg)', borderRadius:10, padding:'7px 10px' }}>
                  <b style={{ color:'var(--ink)' }}>{m.to === 'client' ? 'Клиенту' : 'Администратору'}:</b> {m.t}{m.file && ' 📎 встреча.ics'}</div>)}
              </div></details>
          </div>
        );
      })}
    </div>
  );
}

function WidgetTab({ S, bookings, setBookings, flash, goReq }) {

      <div className="fld"><label>Услуга *</label><select value={svc} onChange={e => { setSvc(e.target.value); setTime(''); }}><option value="">Выберите услугу</option>{SERVICES.map(s => <option key={s}>{s}</option>)}</select></div>
      <div className="fld" style={{ marginTop:10 }}><label>Формат встречи *</label>
        <div className="chips">{FORMATS.map(x => <button key={x} className={fmt === x ? 'on' : ''} onClick={() => { setFmt(x); setDay(''); setTime(''); }}>{x}</button>)}</div>
        {fmt === 'Офлайн встреча' && <div className="hint" style={{ marginTop:6 }}>Офлайн: {S.rules.offlineDays.map(i => DOW[i]).join(', ') || 'нет дней'}</div>}
        {fmt === 'Видеозвонок' && <div className="hint" style={{ marginTop:6 }}>Ссылку на Google Meet пришлём после подтверждения.</div>}</div>
      <div className="fld" style={{ marginTop:10 }}><label>Дата *</label>
        {!svc ? <div className="hint">Сначала выберите услугу</div> : <MonthGrid cursor={cursor} setCursor={setCursor} selected={day} cell={cell} onPick={d => { setDay(ds(d)); setTime(''); }} />}</div>
      {info && !info.closed && <div className="fld" style={{ marginTop:10 }}><label>Время *</label>

/* ───────── agent tasks: план → согласование → выполнение → отчёт ───────── */
const AKEY = 'st96-agent-v1';
const RISK = { read:['Чтение', 'var(--teal)', 'var(--teal-soft)'], write:['Подготовка', 'var(--blue)', 'var(--blue-soft)'], send:['Отправка', 'var(--amber)', 'var(--amber-soft)'], danger:['Только с вашим подтверждением', 'var(--red)', 'var(--red-soft)'] };
const ASTATUS = { planning:['Составляет план', 'var(--violet)', 'var(--violet-soft)'], approval:['Ждёт согласования', 'var(--amber)', 'var(--amber-soft)'], running:['Выполняется', 'var(--blue)', 'var(--blue-soft)'], paused:['Ждёт подтверждения шага', 'var(--red)', 'var(--red-soft)'], done:['Готово', 'var(--green)', 'var(--green-soft)'], rejected:['Отклонено', 'var(--mute)', 'var(--bg)'] };
const iso = () => new Date().toISOString();
const fdt = s => new Date(s).toLocaleString('ru-RU', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
const ftm = s => new Date(s).toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
const mkStep = (text, risk) => ({ id:uid('s'), text, risk, on:true, state:'todo' });

/* В рабочей версии план составляет Claude (Opus) по тексту, вложениям и базе знаний; здесь — подбор по ключевым словам */
function makePlan(text, attach) {
  const t = text.toLowerCase(), S = mkStep;
  const steps = [S('Прочитать задание' + (attach.length ? ` и вложения (${attach.length})` : ''), 'read')];
  if (/групп|заявк/.test(t)) steps.push(S('Забрать новые заявки из Telegram-группы', 'read'), S('Разнести заявки по услугам и формам, обновить сегменты', 'write'));
  else if (/сегмент|аудитор|клиент/.test(t)) steps.push(S('Собрать сегмент клиентов по условиям из задания', 'read'));
  if (/шаблон|текст|ответ|пост|сообщен/.test(t)) steps.push(S('Подготовить варианты текста по базе знаний студии', 'write'));
  if (/статист|аналит|отч[её]т/.test(t)) steps.push(S('Выгрузить статистику по воронкам и заявкам за период', 'read'));
  if (/рассыл|разослать|отправ/.test(t)) steps.push(S('Отправить тестовое сообщение администратору', 'send'), S('Запустить рассылку по сегменту', 'danger'));
  if (/удал|очист/.test(t)) steps.push(S('Удалить выбранные записи', 'danger'));
  if (steps.length === 1) steps.push(S('Подготовить черновик результата', 'write'), S('Проверить результат на ошибки и соответствие тону студии', 'read'));
  steps.push(S('Сформировать отчёт о выполнении', 'write'));
  return steps;
}
function buildReport(t) {
  const done = t.plan.filter(s => s.state === 'done'), skipped = t.plan.filter(s => s.state === 'skipped' || !s.on);
  const n = 40 + (t.title.length * 7) % 120;
  return { at:iso(), summary:`Выполнено шагов: ${done.length} из ${t.plan.length}${skipped.length ? `, пропущено: ${skipped.length}` : ''}. Обработано записей: ${n}.`,
    results:done.map(s => s.text), tokens:9000 + done.length * 2300, cost:(0.18 + done.length * 0.07).toFixed(2) };
}
function seedAgent() {
  const ago = m => new Date(Date.now() - m * 60000).toISOString();
  const t1 = { id:'t1', title:'Разобрать заявки из группы за неделю', text:'Забери новые заявки из Telegram-группы, **разнеси по услугам** и обнови сегменты.\n- ретушь\n- нейрофотосессия', attach:[], status:'done', rev:1, created:ago(300),
    plan:[mkStep('Прочитать задание', 'read'), mkStep('Забрать новые заявки из Telegram-группы', 'read'), mkStep('Разнести заявки по услугам и формам, обновить сегменты', 'write'), mkStep('Сформировать отчёт о выполнении', 'write')].map(s => ({ ...s, state:'done' })),
    log:[{ at:ago(300), text:'Задание создано' }, { at:ago(299), text:'Агент составил план, ждёт согласования' }, { at:ago(290), text:'План утверждён' }, { at:ago(286), text:'Все шаги выполнены, отчёт готов' }] };
  t1.report = buildReport(t1);
  const t2 = { id:'t2', title:'Рассылка о ноябрьской скидке на ретушь', text:'Подготовить **текст рассылки** клиентам, которые интересовались ретушью: скидка 15% до конца ноября. Тон дружелюбный, без капса.', attach:[{ id:'f1', kind:'image', name:'banner-nov.jpg' }],
    status:'approval', rev:1, created:ago(12), plan:makePlan('Подготовить текст рассылки клиентам о скидке', [{}]), log:[{ at:ago(12), text:'Задание создано' }, { at:ago(11), text:'Агент составил план, ждёт согласования' }] };
  return [t2, t1];
}
function loadA() {
  try {
    const s = JSON.parse(localStorage.getItem(AKEY));
    if (Array.isArray(s)) return s.map(t => t.status === 'planning' || t.status === 'running' || t.status === 'paused'
      ? { ...t, status:'approval', plan:t.plan.length ? t.plan : makePlan(t.text, t.attach) } : t);
  } catch (e) {}
  return seedAgent();
}

function AgentPage({ go }) {
  const [tasks, setT] = useState(loadA), [openId, setOpen] = useState(null), [compose, setCompose] = useState(false);
  const [filter, setFilter] = useState('all'), [toast, setToast] = useState(''), [note, setNote] = useState('');
  const setTasks = fn => setT(prev => { const n = typeof fn === 'function' ? fn(prev) : fn; try { localStorage.setItem(AKEY, JSON.stringify(n)); } catch (e) {} return n; });
  const patch = (id, p) => setTasks(ts => ts.map(t => t.id === id ? { ...t, ...(typeof p === 'function' ? p(t) : p) } : t));
  const flash = m => { setToast(m); clearTimeout(flash.t); flash.t = setTimeout(() => setToast(''), 2600); };
  const L = text => ({ at:iso(), text });
  const t = tasks.find(x => x.id === openId) || null;

  const planLater = (id, make, logText) => setTimeout(() => patch(id, x => ({ status:'approval', plan:make(x), log:[...x.log, L(logText)] })), 1300);
  const create = ({ title, text, attach }) => {
    const x = { id:uid('t'), title, text, attach, status:'planning', plan:[], log:[L('Задание создано')], rev:1, created:iso() };
    setTasks(ts => [x, ...ts]); setCompose(false); setOpen(x.id); setNote('');
    planLater(x.id, () => makePlan(text, attach), 'Агент составил план, ждёт согласования');
  };
  const upStep = (sid, p) => patch(t.id, x => ({ plan:x.plan.map(s => s.id === sid ? { ...s, ...p } : s) }));
  const addStep = () => patch(t.id, x => ({ plan:[...x.plan.slice(0, -1), mkStep('Новый шаг', 'write'), x.plan[x.plan.length - 1]] }));
  const delStep = sid => patch(t.id, x => ({ plan:x.plan.filter(s => s.id !== sid) }));
  const approve = () => {
    if (!t.plan.some(s => s.on && s.state === 'todo')) return flash('Включите хотя бы один шаг');
    patch(t.id, x => ({ status:'running', plan:x.plan.map(s => !s.on && s.state === 'todo' ? { ...s, state:'skipped' } : s), log:[...x.log, L(x.rev > 1 || x.log.some(l => l.text === 'План утверждён') ? 'Продолжаем по утверждённому плану' : 'План утверждён, агент приступает')] }));
  };
  const revise = () => {
    if (!note.trim()) return flash('Напишите, что поправить в плане');
    const n = note.trim(); setNote('');
    patch(t.id, x => ({ status:'planning', rev:x.rev + 1, log:[...x.log, L(`Замечание к плану: «${n}»`)] }));
    planLater(t.id, x => [...x.plan.slice(0, -1), mkStep(`Учесть замечание: «${n}»`, 'write'), x.plan[x.plan.length - 1]], 'Агент обновил план, ждёт согласования');
  };
  const reject = () => { patch(t.id, x => ({ status:'rejected', log:[...x.log, L('Задание отклонено, ничего не выполнялось')] })); };
  const stop = () => patch(t.id, x => ({ status:'approval', log:[...x.log, L('Остановлено вами. Выполненные шаги сохранены')] }));
  const danger = ok => patch(t.id, x => {
    const s = x.plan.find(p => p.on && p.state === 'todo' && p.risk === 'danger' && !p.ok);
    return { status:'running', plan:x.plan.map(p => p.id === s.id ? (ok ? { ...p, ok:true } : { ...p, state:'skipped' }) : p), log:[...x.log, L(ok ? `Вы подтвердили: «${s.text}»` : `Вы отказались: «${s.text}» пропущен`)] };
  });
  const repeat = () => create({ title:t.title + ' (повтор)', text:t.text, attach:t.attach });
  const dl = () => {
    const r = t.report, md = `# ${t.title}\n\n${r.summary}\n\n## Что сделано\n${r.results.map(x => '- ' + x).join('\n')}\n\nТокенов: ${r.tokens}, ориентировочная стоимость: $${r.cost}\n`;
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([md], { type:'text/markdown' })); a.download = 'otchet-agenta.md'; a.click();
  };

  /* исполнитель: каждый шаг — два тика (старт → готово). В рабочей версии это очередь на сервере. */
  const run = tasks.find(x => x.status === 'running');
  const sig = run ? run.plan.map(s => s.state + (s.ok ? '!' : '')).join() : '';
  useEffect(() => {
    if (!run) return;
    const h = setTimeout(() => patch(run.id, x => {
      const cur = x.plan.find(s => s.state === 'run');
      if (cur) return { plan:x.plan.map(s => s.id === cur.id ? { ...s, state:'done' } : s), log:[...x.log, L(`Готово: ${cur.text}`)] };
      const nx = x.plan.find(s => s.state === 'todo');

      if (nx.risk === 'danger' && !nx.ok) return { status:'paused', log:[...x.log, L(`Остановился перед шагом «${nx.text}» и ждёт вашего подтверждения`)] };
      return { plan:x.plan.map(s => s.id === nx.id ? { ...s, state:'run' } : s) };
    }), 1000);
    return () => clearTimeout(h);
  }, [run && run.id, sig]);

  const counts = { all:tasks.length, approval:tasks.filter(x => x.status === 'approval' || x.status === 'paused').length, running:tasks.filter(x => x.status === 'running' || x.status === 'planning').length, done:tasks.filter(x => x.status === 'done').length };
  const list = tasks.filter(x => filter === 'all' || (filter === 'approval' && (x.status === 'approval' || x.status === 'paused')) || (filter === 'running' && (x.status === 'running' || x.status === 'planning')) || (filter === 'done' && x.status === 'done'));
  const doneN = t ? t.plan.filter(s => s.state === 'done' || s.state === 'skipped').length : 0, onN = t ? t.plan.filter(s => s.on || s.state !== 'todo').length : 0;
  const pending = t && t.status === 'paused' ? t.plan.find(s => s.on && s.state === 'todo' && s.risk === 'danger' && !s.ok) : null;

  return (
    <div className="app">
      <Rail page="agent" go={go} />
      <div className="main">
        <div className="top">
          <b style={{ fontSize:16, flex:'1 1 auto' }}>Задания агента</b>
          <span className="pill hide-s">Агент действует только по утверждённому плану</span>
          <button className="btn primary" onClick={() => setCompose(true)}><Ic d={P.plus} size={15} /> Новое задание</button>
        </div>
        <div className={`agent ${t ? 'has-open' : ''}`}>
          <div className="alist">
            <div className="seg scroll">{[['all', 'Все'], ['approval', 'Согласовать'], ['running', 'В работе'], ['done', 'Готовые']].map(([k, l]) => <button key={k} className={filter === k ? 'on' : ''} onClick={() => setFilter(k)}>{l} {counts[k]}</button>)}</div>
            {list.length === 0 && <div className="hint" style={{ padding:12 }}>Здесь пока пусто.</div>}
            {list.map(x => { const st = ASTATUS[x.status]; return (
              <button key={x.id} className={`atask ${openId === x.id ? 'on' : ''}`} onClick={() => { setOpen(x.id); setNote(''); }}>
                <b style={{ fontSize:14, lineHeight:1.3 }}>{x.title}</b>
                <span style={{ display:'flex', gap:8, alignItems:'center', flexWrap:'wrap' }}>
                  <span className="chip" style={{ background:st[2], color:st[1] }}>{x.status === 'planning' && <i className="spin" />}{st[0]}</span>
                  <span className="hint">{fdt(x.created)}{x.attach.length ? ` · вложений: ${x.attach.length}` : ''}</span>
                </span>
